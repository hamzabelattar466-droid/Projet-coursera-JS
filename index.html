
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            color: #222;
            margin-bottom: 25px;
        }

        #image {
            width: 80%;
            max-width: 800px;
            height: 400px;
            margin: 20px auto;
            background-color: #ddd;
            background-image: url('');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 3px solid #333;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #333;
            font-size: 22px;
            font-weight: bold;
        }

        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .gallery img {
            width: 220px;
            height: 150px;
            object-fit: cover;
            border: 3px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            #image {
                width: 100%;
                height: 250px;
            }

            .gallery img {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <h1>Interactive Photo Gallery</h1>

    <div id="image">
        Hover over an image below to display here
    </div>

    <div class="gallery">

        <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
            alt="Beautiful nature landscape"
            onmouseover="upDate(this)"
            onmouseleave="undo()">

        <img
            src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=600"
            alt="Beautiful ocean and waves"
            onmouseover="upDate(this)"
            onmouseleave="undo()">

        <img
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
            alt="Beautiful mountain lake"
            onmouseover="upDate(this)"
            onmouseleave="undo()">

        <img
            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
            alt="Green forest with sunlight"
            onmouseover="upDate(this)"
            onmouseleave="undo()">

        <img
            src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600"
            alt="Tropical beach"
            onmouseover="upDate(this)"
            onmouseleave="undo()">

    </div>

    <script>

        function upDate(previewPic) {

            console.log("Mouse over an image");
            console.log("Alt:", previewPic.alt);
            console.log("Source:", previewPic.src);

            document.getElementById("image").innerHTML =
                previewPic.alt;

            document.getElementById("image").style.backgroundImage =
                "url('" + previewPic.src + "')";
        }

        function undo() {

            document.getElementById("image").style.backgroundImage =
                "url('')";

            document.getElementById("image").innerHTML =
                "Hover over an image below to display here";
        }

    </script>

</body>
</html>
